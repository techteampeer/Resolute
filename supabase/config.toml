# Supabase CLI local-dev config. Only project_id is required; every other
# setting uses the CLI's defaults (API on 54321, which also serves the MCP
# endpoint registered in .mcp.json as http://localhost:54321/mcp).
project_id = "resolute"

# Edge Functions runtime can't start inside the Claude Code sandbox (runc is
# denied the rlimit it needs) and nothing in this repo uses it.
[edge_runtime]
enabled = false
