# Continuous integration gate. Runs on every PR and on pushes to the main and
# feature branches. Two jobs:
#   build          — the gate that must always be green (npm ci + vite build).
#   db-integrity   — applies ALL migrations from scratch on a real Supabase stack
#                    (catches malformed migrations and repo/prod drift, which has
#                    bitten this project before), then runs the RLS/integrity
#                    audits over the real REST path.
#
# NOTE: this is Phase 0 of docs/ARCHITECTURE-ROADMAP.md workstream I. The `build`
# job now also lints (eslint flat config, --max-warnings=0). Typecheck and the
# full audit/E2E suite are added as those pieces land. Mark `build` (and, once it
# has had a green shakeout run, `db-integrity`) as required checks in the
# branch-protection settings.
name: CI

on:
  pull_request:
  push:
    branches: [main, 'claude/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  db-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: PostgreSQL client (the audits shell out to psql)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not `latest`: resolving "latest" hits GitHub's release API,
          # which is rate-limited on shared runners and intermittently failed the
          # job at setup ("Failed to resolve latest Supabase CLI release: rate
          # limit exceeded"). A fixed version fetches one known tag and is stable.
          # Bump deliberately when a newer CLI is needed.
          version: 2.117.0
      # `supabase start` applies every migration in supabase/migrations in order
      # plus supabase/seed.sql. A migration that fails to apply from scratch — the
      # exact drift that hit 20260909120000 — fails the job here, before deploy.
      - name: Start Supabase (applies migrations + seed from scratch)
        run: supabase start
      - name: Order-integrity + privilege-guard audit (RLS, real JWTs)
        run: npm run test:integrity
      # B1 GCP charge API: supertest → the real chargesRouter → withUserClaims →
      # RLS + resolve_order_charge, against the running stack's Postgres. Needs the
      # service's own deps (pg/express/supertest), which the root install omits.
      - name: GCP charge API integration (Cloud SQL parity)
        run: npm install --prefix services/api --no-audit --no-fund
      # The GCP API resolves fees through gcp_resolve_order_charge (spec B1 §6),
      # which lives in the guarded GCP migration, not supabase/migrations. Install
      # it on this throwaway local stack (resolve_order_charge/admin_create_client
      # already exist here and must compare identical, or the migration aborts).
      - name: GCP charge procedures on the local stack
        run: >-
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          -X -v ON_ERROR_STOP=1 -v apply=true -v confirm_db=postgres
          -f gcp/migrations/20261124000000_charge_and_client_functions.sql
      - name: Run GCP charge API integration
        working-directory: services/api
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 54322
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: postgres
        run: npm run test:integration

  # GCP database package (gcp/): bootstrap, read-only preflight and the guarded
  # migration, verified on a disposable PostgreSQL 15 container (production is
  # 15) built the Cloud SQL way -- schema owner NOT a superuser, the API as its
  # NOINHERIT app login. Populated orders are loaded BEFORE the migration and
  # the suite refuses an empty table, so it cannot pass vacuously.
  # Talks to nothing but its own localhost container; see gcp/test/run.sh.
  gcp-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - name: PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: services/api dependencies
        run: npm ci --prefix services/api --no-audit --no-fund
      - name: GCP database verification (disposable PostgreSQL 15)
        run: bash gcp/test/run.sh
